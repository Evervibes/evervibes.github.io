 g.querySelectorAll('img').forEach(im=>{const ok=()=>{im.classList.add('ok');im.parentNode.classList.add('ok')};im.complete&&im.naturalWidth?ok():(im.onload=ok,im.onerror=ok)});
 g.querySelectorAll('.cd').forEach(c=>io?io.observe(c):c.classList.add('in'));
 if(window.VanillaTilt&&matchMedia('(hover:hover)').matches&&!rm)VanillaTilt.init(g.querySelectorAll('.cv'),{max:9,speed:500,glare:true,'max-glare':.22,scale:1.02})}
function view(t){const o=t===lib?det:lib;if(t.classList.contains('on')&&!o.classList.contains('on'))return;o.classList.remove('on');t.classList.add('on');hd.classList.remove('h');scrollTo(0,0);lenis&&lenis.scrollTo(0,{immediate:true});
 if(G)gsap.fromTo(t,{opacity:0,y:28},{opacity:1,y:0,duration:.75,ease:'power3.out',clearProps:'opacity,transform'});ST&&ScrollTrigger.refresh()}
function showDet(m){const p=+L(K(m))||0,h='#/r/'+m.id;
 det.innerHTML='<div class="dt"><div class="cv ok"><img class="ok" src="'+m.cover+'" alt=""></div><div><h1>'+esc(m.title)+'</h1><div class="meta">'+m.pages.length+' pages</div><div class="br">'+(p>0?'<a class="btn p" href="'+h+'">▶ Continue · p.'+(p+1)+'</a>':'')+'<a class="btn'+(p>0?'':' p')+'" id="b0" href="'+h+'">'+(p>0?'↺ Start over':'▶ Start reading')+'</a></div><h3>Jump to page</h3><div class="chs">'+m.pages.map((_,i)=>'<button class="ch" data-i="'+i+'">'+(i+1)+'</button>').join('')+'</div></div></div>';
 $('#b0').onclick=()=>{startAt=0};
 det.querySelector('.chs').onclick=e=>{const b=e.target.closest('button');if(b){startAt=+b.dataset.i;location.hash=h}};view(det)}
function upd(){const n=R.m.pages.length;$('#cn').textContent=(R.i+1)+' / '+n;sl.value=R.i+1;$('#bar').style.width=((R.i+1)/n*100)+'%';L(K(R.m),R.i);
 for(const k of [R.i+1,R.i+2,R.i-1])if(R.m.pages[k])new Image().src=R.m.pages[k]}
function show(i,d){const a=[...pv.children],old=a[a.length-1];a.slice(0,-1).forEach(x=>x.remove());
 const im=new Image();im.alt='';im.draggable=false;im.src=R.m.pages[i];pv.classList.remove('ld');im.onload=()=>pv.classList.add('ld');pv.appendChild(im);
 const dx=d*Math.min(120,innerWidth*.25);
 if(d&&!rm){im.animate([{opacity:0,transform:'translateX('+dx+'px) scale(.98)'},{opacity:1,transform:'none'}],{duration:450,easing:E});
  if(old){const f=old.style.transform||'none';old.style.transform='';old.animate([{opacity:1,transform:f},{opacity:0,transform:'translateX('+(-dx)+'px) scale(.98)'}],{duration:350,easing:E,fill:'forwards'}).onfinish=()=>old.remove()}}
 else if(old)old.remove();
 R.i=i;upd()}
function buildScroll(){sv.innerHTML=R.m.pages.map((p,i)=>'<img loading="lazy" decoding="async" alt="" data-i="'+i+'" src="'+p+'">').join('');
 so=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){R.i=+e.target.dataset.i;upd()}}),{root:sv,rootMargin:'-50% 0px -50% 0px'});
 [...sv.children].forEach(im=>{im.onload=()=>im.classList.add('ok');so.observe(im)})}
function setMode(mo){R.mode=mo;L('md',mo);rd.classList.remove('paged','scroll');rd.classList.add(mo);$('#md').textContent=mo==='paged'?'☰':'▭';
 pv.innerHTML='';sv.innerHTML='';if(so){so.disconnect();so=null}
 if(mo==='paged')show(R.i,0);else{buildScroll();const t=sv.children[R.i];if(t){sv.style.scrollBehavior='auto';t.scrollIntoView({block:'start'});sv.style.scrollBehavior=''}upd()}}
function openRd(m){const was=rd.classList.contains('on');R.m=m;let i=startAt!=null?startAt:(+L(K(m))||0);startAt=null;R.i=Math.max(0,Math.min(m.pages.length-1,i));
 rd.classList.remove('ui-off');rd.classList.add('on');$('#rt').textContent=m.title;sl.max=m.pages.length;sl.style.direction=R.rtl?'rtl':'ltr';
 lenis&&lenis.stop();document.documentElement.style.overflow='hidden';setMode(R.mode);
 if(!was&&!rm)rd.animate([{clipPath:'circle(0% at 50% 100%)'},{clipPath:'circle(150% at 50% 100%)'}],{duration:750,easing:'cubic-bezier(.77,0,.175,1)'})}
function closeRd(){if(!rd.classList.contains('on'))return;rd.classList.remove('on');pv.innerHTML='';sv.innerHTML='';so&&so.disconnect();lenis&&lenis.start();document.documentElement.style.overflow=''}
function go(s){const n=R.m.pages.length,j=R.i+s;
 if(j<0||j>=n){pv.animate([{transform:'none'},{transform:'translateX('+(s>0?-14:14)+'px)'},{transform:'none'}],{duration:260});toast(j<0?'First page':'End · '+R.m.title);return}
 if(R.mode==='paged')show(j,s*(R.rtl?-1:1));else{const t=sv.children[j];t&&t.scrollIntoView({behavior:'smooth',block:'start'})}}
function route(){nav++;const h=location.hash.split('/'),m=D.mangas.find(x=>x.id===h[2]);
 if(h[1]==='r'&&m){openRd(m);return}
 closeRd();if(h[1]==='m'&&m)showDet(m);else{renderLib(sq.value);view(lib)}}
const closeBtn=()=>{nav>1?history.back():location.hash='#/m/'+R.m.id};
$('#x').onclick=closeBtn;$('#pr').onclick=()=>go(R.rtl?1:-1);$('#nx').onclick=()=>go(R.rtl?-1:1);
$('#md').onclick=()=>{setMode(R.mode==='paged'?'scroll':'paged');toast(R.mode==='paged'?'Page mode':'Scroll mode')};
$('#dr').onclick=()=>{R.rtl=!R.rtl;L('rt',R.rtl?'1':'0');sl.style.direction=R.rtl?'rtl':'ltr';toast(R.rtl?'Right to left (manga)':'Left to right')};
sl.oninput=()=>{const i=+sl.value-1;if(R.mode==='paged')show(i,0);else{const t=sv.children[i];t&&t.scrollIntoView({block:'start'})}};
const tap=e=>{if(swiped||(window.visualViewport&&visualViewport.scale>1.02))return;const x=e.clientX/innerWidth;
 if(R.mode==='paged'&&x<.3)go(R.rtl?1:-1);else if(R.mode==='paged'&&x>.7)go(R.rtl?-1:1);else rd.classList.toggle('ui-off')};
pv.onclick=tap;sv.onclick=tap;
let tx=null,ty=0,dx=0,drag=false;
pv.addEventListener('touchstart',e=>{if(e.touches.length!==1||(window.visualViewport&&visualViewport.scale>1.02)){tx=null;return}tx=e.touches[0].clientX;ty=e.touches[0].clientY;dx=0;drag=false},{passive:true});
pv.addEventListener('touchmove',e=>{if(tx==null)return;dx=e.touches[0].clientX-tx;if(!drag&&Math.abs(dx)>10&&Math.abs(dx)>Math.abs(e.touches[0].clientY-ty))drag=true;const im=pv.lastElementChild;if(drag&&im)im.style.transform='translateX('+dx*.6+'px)'},{passive:true});
pv.addEventListener('touchend',()=>{if(tx==null)return;const im=pv.lastElementChild;tx=null;
 if(drag){swiped=true;setTimeout(()=>swiped=false,350);
  if(Math.abs(dx)>60)go((dx<0)!==R.rtl?1:-1);
  else if(im){const f=im.style.transform;im.style.transform='';im.animate([{transform:f},{transform:'none'}],{duration:320,easing:E})}}});
let ls=0;sv.addEventListener('scroll',()=>{const y=sv.scrollTop,d=y-ls;if(Math.abs(d)>8){rd.classList.toggle('ui-off',d>0&&y>80);ls=y}},{passive:true});
addEventListener('keydown',e=>{if(!rd.classList.contains('on'))return;const k=e.key;
 if(k==='Escape')closeBtn();else if(k==='ArrowRight')go(R.rtl?-1:1);else if(k==='ArrowLeft')go(R.rtl?1:-1);else if(k===' '&&R.mode==='paged'){e.preventDefault();go(1)}});
let ly=0;addEventListener('scroll',()=>{const y=scrollY;hd.classList.toggle('h',y>ly&&y>140);ly=y},{passive:true});
sq.oninput=()=>{if(location.hash.length>2)location.hash='#/';else renderLib(sq.value)};
addEventListener('hashchange',route);
if(!D.mangas.length)$('#grid').innerHTML='<p class="mut">No manga yet.</p>';
route();
setTimeout(()=>{const p=$('#pl');p.classList.add('done');setTimeout(()=>p.remove(),1500)},900);
})();
</script></body></html>
